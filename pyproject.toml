[project]
name = "maxx-tools"
version = "0.1.0"
description = "AI-Orchestrated Unity Game Development Tools for MAXX Project"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "krugerw007", email = "krugerw007@gmail.com"}
]
maintainers = [
    {name = "krugerw007", email = "krugerw007@gmail.com"}
]
keywords = ["unity", "game-dev", "ai", "orchestration", "mcp", "agent-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
    "github-py>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
    "asyncio-mqtt>=0.16.1",
    "aiofiles>=23.2.1",
    "orjson>=3.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
agent-brain = [
    "mcp>=1.0.0",
]
unity = [
    "pythonnet>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools/python"]
include = ["scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "Q", "RET", "SIM", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "TRY", "FUR", "SLF", "TID",
]
ignore = ["E501", "B008", "C901"]
per-file-ignores = {
    "tests/*": ["S101", "S106"],
    "scripts/*": ["T201"],
}
exclude = [".venv", "venv", "__pycache__", "build", "dist", ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "agent: Agent-related tests",
]

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skip = ["B101", "B601"]

[tool.safety]
ignore = ["54931"]  # Example: ignore specific vulnerability if needed