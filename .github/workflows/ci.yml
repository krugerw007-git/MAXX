name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  DOTNET_VERSION: '8.0.x'
  PYTHON_VERSION: '3.11'
  UNITY_VERSION: '2022.3.0f1'

jobs:
  # ===========================================
  # CODE QUALITY CHECKS
  # ===========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/python/requirements-dev.txt
          pip install -e tools/python

      - name: Run Ruff (lint)
        run: |
          ruff check tools/python --output-format=github

      - name: Run Ruff (format check)
        run: |
          ruff format --check tools/python

      - name: Run MyPy (type check)
        run: |
          mypy tools/python

      - name: Run Bandit (security)
        run: |
          bandit -r tools/python -f json -o bandit-report.json || true

      - name: Run Safety (dependency check)
        run: |
          safety check --json --output safety-report.json || true

  # ===========================================
  # PYTHON TESTS
  # ===========================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/python/requirements-dev.txt
          pip install -e tools/python

      - name: Run pytest
        run: |
          pytest tools/python --cov=scripts --cov-report=xml --cov-report=term-missing --junitxml=pytest-results.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  # ===========================================
  # MARKDOWN LINTING
  # ===========================================
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint docs/**/*.md README.md --config .markdownlint.json

  # ===========================================
  # YAML LINTING
  # ===========================================
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .github/workflows/ docker-compose.yml

  # ===========================================
  # DOCKER BUILD TEST
  # ===========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images (test)
        run: |
          docker-compose -f docker-compose.yml build --no-cache agent-brain claude-code-runner codex-runner

  # ===========================================
  # SECURITY SCAN
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # DOCUMENTATION CHECK
  # ===========================================
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          REQUIRED_DOCS=(
            "README.md"
            "PROJECT_MANIFEST.MD"
            "docs/planning/TASKS_INDEX.md"
            "docs/planning/RESEARCH/RESEARCH_INDEX.md"
            "docs/architecture/ARCHITECTURE.md"
            "docs/development/DEVELOPMENT_STANDARDS.md"
            "docs/development/GIT_WORKFLOW.md"
            "docs/development/TESTING_STRATEGY.md"
            "docs/development/DOCUMENTATION_STANDARDS.md"
          )
          
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [[ ! -f "$doc" ]]; then
              echo "::error::Missing required documentation: $doc"
              exit 1
            fi
          done
          
          echo "All required documentation files exist"

      - name: Check task index format
        run: |
          # Verify TASKS_INDEX.md has required columns
          if ! grep -q "| ID | Task | Status |" docs/planning/TASKS_INDEX.md; then
            echo "::error::TASKS_INDEX.md missing required header"
            exit 1
          fi
          
          # Verify no tasks stuck at 0% without status
          if grep -q "| 📋 | 0% |" docs/planning/TASKS_INDEX.md; then
            echo "::warning::Some tasks are still at 0% planned status"
          fi

  # ===========================================
  # UNITY BUILD (Placeholder - requires Unity license)
  # ===========================================
  # unity-build:
  #   name: Unity Build Test
  #   runs-on: ubuntu-latest
  #   if: false  # Enable when Unity license configured
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #       
  #     - name: Setup Unity
  #       uses: game-ci/unity-installer@v4
  #       with:
  #         unityVersion: ${{ env.UNITY_VERSION }}
  #         
  #     - name: Build Unity project
  #       uses: game-ci/unity-builder@v4
  #       env:
  #         UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  #       with:
  #         projectPath: src
  #         targetPlatform: StandaloneWindows64

  # ===========================================
  # SUMMARY
  # ===========================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, python-tests, markdown-lint, yaml-lint, docker-build, security-scan, docs-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          FAILED_JOBS=()
          for job in code-quality python-tests markdown-lint yaml-lint docker-build security-scan docs-check; do
            STATUS="${{ needs.$job.result }}"
            if [[ "$STATUS" != "success" ]]; then
              FAILED_JOBS+=("$job: $STATUS")
            fi
          done
          
          if [[ ${#FAILED_JOBS[@]} -gt 0 ]]; then
            echo "::error::The following jobs failed:"
            for failed in "${FAILED_JOBS[@]}"; do
              echo "  - $failed"
            done
            exit 1
          else
            echo "All CI checks passed! ✅"
          fi